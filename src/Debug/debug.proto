//// WARDUINO DEBUG API

syntax = "proto3";

package debug;

option optimize_for = LITE_RUNTIME;
option cc_enable_arenas = false;

////

//// 2 types of messages: DebugMessage or Notification:

message DebugMessage {  // messages FROM frontend
    Command command = 1;

    // optional payload
    optional Payload payload = 2;
}

message Notification {  // messages TO frontend
    enum Type {
        // simple notifications: TODO a single acknowledgement
        continued = 0;
        halted = 1;
        paused = 2;
        stepped = 3;
        hitbreakpoint = 4;
        newevent = 5;  // a new event got pushed from proxy
        changeaffected = 11;

        // payload responses:
        dump = 6;
        dumplocals = 7;
        snapshot = 8;
        dumpevents = 9;
        dumpcallbacks = 10;

        // errors:
        malformed = 12;  // received message was malformed
        unknown = 13;    // received unknown command
    }

    Type type = 1;
    optional Payload payload = 2;
}


// DebugMessage contents

enum State {
    WARDUINOrun   = 0;
    WARDUINOpause = 1;
    WARDUINOstep  = 2;
    PROXYrun      = 3;  // Running state used when executing a proxy call. During
                        // this state the call is set up and executed by the main
                        // loop. After execution, the state is restored to
                        // PROXYhalt
    PROXYhalt     = 4;  // Do not run the program (program runs on computer, which
                        // sends messages for primitives, do forward interrupts)
}

enum Command {
    // standard debug operations
    run = 0;
    halt = 1;
    pause = 2;
    step = 3;
    stepover = 4;
    bpadd = 5;
    bprem = 6;

    // inspection operations
    dump = 7;
    dumplocals = 8;
    snapshot = 9;
    dumpevents = 10;
    dumpcallbacks = 11;

    // update operations
    updatefunc = 12;
    updatelocal = 13;
    updatecallbacks = 14;

    // edward debug operations
    loadsnapshot = 15;
    proxify = 16;
    proxyadd = 17;
    proxyrem = 18;
    proxycall = 19;
    popevent = 20;
    pushevent = 21;

    // new instructions
    continuefor = 22;
    inspect = 23;
    reset = 24;
    invoke = 25;

    // todo overrides
}

//// content of messages:

message Payload {
    oneof payload {
        Snapshot snapshot = 1;          // dumps
        Locals locals = 2;              // dumplocals
        Function function = 3;          // dumps, updatefunc, proxyadd/rem
        uint32 breakpoint = 4;          // bpadd, bprem
        EventsQueue queue = 5;          // dumps
        Event event = 6;                // event operations
        Range range = 7;                // dump eventsqueue
        CallbackMapping callbacks = 8;  // dump/update callbacks
        RFC call = 9;                   // proxycall
    }
}

message Snapshot {
    // minimal state fields
    uint32 program_counter = 1;
    State state = 2;
    repeated uint32 breakpoints = 3;
    repeated Function functions = 4;
    repeated CallstackEntry callstack = 5;

    // optional extending state fields
    optional Locals locals = 6;
    optional EventsQueue queue = 7;
    optional CallbackMapping callbacks = 8;
}

message Function {
    int32 fidx = 1;

    // optional fields for updating:
    Range range = 2;  // from, to
    Locals locals = 3;
    bytes instructions = 4;  // implementation
}

message RFC {  // Remote Function Call
    int32 fidx = 1;
    int32 argcount = 2;
    repeated Value args = 3;
}

message CallstackEntry {
    int32 type = 1;
    int32 fidx = 2;
    int32 sp = 3;
    int32 fp = 4;
    int32 start = 5;
    int32 ra = 6;
}

message Locals {
    int32 count = 1;
    repeated Value values = 2;
}

message Value {
    enum Type {
        i32 = 0;
        i64 = 1;
        f32 = 2;
        f64 = 3;
        any = 4;
    }
    Type type = 1;
    string value = 2;  // can be any wasm value
    int32 index = 3;
}

message CallbackMapping {
    repeated CallbackEntry entries = 1;
}

message CallbackEntry {
    string topic = 1;
    repeated int32 tidx = 2;
}

message EventsQueue {
    int32 count = 1;            // total count of events in queue
    repeated Event events = 2;  // slice of events
    optional Range range = 3;   // range of returned slice
}

message Event {
    string topic = 1;
    string payload = 2;
}

message Range {
    int32 start = 1;  // start index
    int32 end = 2;    // end index
}
