// WARDuino debug protocol.
//
// Command and NotificationType are transport-level discriminators. They are
// written as a single byte before the protobuf payload; they are not encoded
// as fields inside another protobuf message.
//
// Frame packet structure:
//
//   [type: uint8][payload length: varint][protobuf payload]
//
// Empty commands and notifications have a zero-length protobuf payload.

syntax = "proto3";

package debug;

option optimize_for = LITE_RUNTIME;
option cc_enable_arenas = false;

// Frontend -> WARDuino.
// The receiver selects the payload schema from the command byte.
enum Command {
  COMMAND_RUN = 0;                  // no payload
  COMMAND_HALT = 1;                 // no payload
  COMMAND_PAUSE = 2;                // no payload
  COMMAND_STEP = 3;                 // no payload
  COMMAND_STEP_OVER = 4;            // no payload
  COMMAND_ADD_BREAKPOINT = 5;       // Breakpoint
  COMMAND_REMOVE_BREAKPOINT = 6;    // Breakpoint
  COMMAND_CLEAR_BREAKPOINTS = 7;    // no payload

  COMMAND_SNAPSHOT = 9;             // snapshot sections

  COMMAND_UPDATE_FUNCTION = 12;     // Function
  COMMAND_UPDATE_LOCAL = 13;        // ValueUpdate
  COMMAND_UPDATE_CALLBACKS = 14;    // CallbackMapping
  COMMAND_UPDATE_MODULE = 26;       // ModuleUpdate
  COMMAND_UPDATE_GLOBAL = 27;       // ValueUpdate
  COMMAND_UPDATE_STACK = 28;        // ValueUpdate

  COMMAND_LOAD_SNAPSHOT = 15;       // Snapshot
  COMMAND_PROXIFY = 16;             // no payload
  COMMAND_ADD_PROXY = 17;           // FunctionRef
  COMMAND_REMOVE_PROXY = 18;        // FunctionRef
  COMMAND_PROXY_CALL = 19;          // RemoteFunctionCall
  COMMAND_POP_EVENT = 20;           // no payload
  COMMAND_PUSH_EVENT = 21;          // Event

  COMMAND_CONTINUE_FOR = 22;        // ContinueFor
  COMMAND_INSPECT = 23;             // Inspect
  COMMAND_RESET = 24;               // no payload
  COMMAND_INVOKE = 25;              // RemoteFunctionCall


  COMMAND_SET_SNAPSHOT_POLICY = 29; // SnapshotPolicyConfig
  COMMAND_SET_OVERRIDE = 30;        // Override
  COMMAND_REMOVE_OVERRIDE = 31;     // Override
}

// WARDuino -> frontend.
// The receiver selects the payload schema from the notification byte.
enum NotificationType {
  NOTIFICATION_CONTINUED = 0;                // no payload
  NOTIFICATION_HALTED = 1;                   // no payload
  NOTIFICATION_PAUSED = 2;                   // no payload
  NOTIFICATION_STEPPED = 3;                  // no payload
  NOTIFICATION_HIT_BREAKPOINT = 4;           // HitBreakpoint
  NOTIFICATION_NEW_EVENT = 5;                // NewEvent (zero-length payload)

  NOTIFICATION_FUNCTION_DUMP = 6;            // Function
  NOTIFICATION_LOCALS_DUMP = 7;              // Locals
  NOTIFICATION_SNAPSHOT = 8;                 // Snapshot
  NOTIFICATION_EVENTS_DUMP = 9;              // EventsQueue
  NOTIFICATION_CALLBACKS_DUMP = 10;          // CallbackMapping
  NOTIFICATION_CHANGE_AFFECTED = 11;         // no payload

  NOTIFICATION_MALFORMED = 12;               // no payload
  NOTIFICATION_UNKNOWN_COMMAND = 13;         // no payload
  NOTIFICATION_OPERATION_RESULT = 14;        // OperationResult
  NOTIFICATION_REMOTE_FUNCTION_RESULT = 15;  // RemoteFunctionResult
  NOTIFICATION_CHECKPOINT = 16;              // Checkpoint
}

enum State {
  STATE_WARDUINO_RUN = 0;
  STATE_WARDUINO_PAUSE = 1;
  STATE_WARDUINO_STEP = 2;
  STATE_PROXY_RUN = 3;
  STATE_PROXY_HALT = 4;
}

// A virtual program address.
message CodeLocation {
  uint32 module_index = 1;
  uint32 program_counter = 2;
}

message Breakpoint {
  CodeLocation location = 1;
}

message HitBreakpoint {
  CodeLocation location = 1;
}

// The notification type carries all information for this event. The empty
// message exists for host-side reflection, but no protobuf bytes are sent.
message NewEvent {}

message ContinueFor {
  uint32 count = 1;
}

// Execution-state selectors understood by the VM. Keeping them as bytes lets
// the protocol add selectors without changing this schema.
message Inspect {
  bytes state = 1;
}

message FunctionRef {
  uint32 function_index = 1;
}

message ValueUpdate {
  uint32 index = 1;
  Value value = 2;
}

message Snapshot {
  uint32 program_counter = 1;
  State state = 2;
  repeated uint32 breakpoints = 3;
  repeated Function functions = 4;
  repeated CallstackEntry callstack = 5;

  Locals locals = 6;
  EventsQueue queue = 7;
  CallbackMapping callbacks = 8;

  repeated Value globals = 9;
  repeated Value stack = 10;
  TableState table = 11;
  MemoryState memory = 12;
  repeated uint32 branch_table = 13;
  repeated IOState io = 14;
  repeated Override overrides = 15;
  uint32 heap_used = 16;
}

message Function {
  uint32 function_index = 1;
  Range range = 2;
  Locals locals = 3;
  bytes instructions = 4;
}

message RemoteFunctionCall {
  uint32 function_index = 1;
  repeated Value arguments = 2;
}

message CallstackEntry {
  uint32 type = 1;
  uint32 function_index = 2;
  uint32 stack_pointer = 3;
  uint32 frame_pointer = 4;
  uint32 start = 5;
  uint32 return_address = 6;
}

message Locals {
  repeated Value values = 1;
}

// The oneof tag is the value type, so a separate type enum and a decimal
// string are unnecessary. Fixed-width fields preserve WebAssembly bits and
// are fast to construct on the MCU.
message Value {
  oneof data {
    fixed32 i32_bits = 1;
    fixed64 i64_bits = 2;
    fixed32 f32_bits = 3;
    fixed64 f64_bits = 4;
    bytes raw = 5;
  }

  uint32 index = 6;
}

message CallbackMapping {
  repeated CallbackEntry entries = 1;
}

message CallbackEntry {
  string topic = 1;
  repeated uint32 table_indexes = 2;
}

message EventsQueue {
  // Total events in the queue; this can exceed the returned slice length.
  uint32 total_count = 1;
  repeated Event events = 2;
  Range range = 3;
}

message Event {
  string topic = 1;
  bytes payload = 2;
}

message Range {
  uint32 start = 1;
  uint32 end = 2;
}

message ModuleUpdate { bytes wasm = 1; }

message IndexedValues { repeated Value values = 1; }

enum SnapshotPolicy {
  SNAPSHOT_POLICY_NONE = 0;
  SNAPSHOT_POLICY_EVERY_INSTRUCTION = 1;
  SNAPSHOT_POLICY_CHECKPOINTING = 2;
}

message SnapshotPolicyConfig {
  SnapshotPolicy policy = 1;
  uint32 interval = 2;
  uint32 minimum_return_count = 3;
  bytes selected_state = 4;
}

message Override {
  string primitive_name = 1;
  repeated fixed32 argument_words = 2;
  fixed32 result = 3;
}

message OperationResult { Command command = 1; bool success = 2; }

message RemoteFunctionResult {
  bool success = 1;
  repeated Value results = 2;
  bytes error = 3;
}

message Checkpoint {
  uint32 instruction_count = 1;
  bool has_primitive_call = 2;
  uint32 primitive_function_index = 3;
  repeated Value arguments = 4;
  repeated Value results = 5;
  Snapshot snapshot = 6;
}

message TableState { uint32 initial = 1; uint32 maximum = 2; repeated uint32 entries = 3; }

message MemoryState { uint32 initial = 1; uint32 maximum = 2; uint32 pages = 3; bytes bytes = 4; }

message IOState { string key = 1; bool output = 2; sint32 value = 3; }
