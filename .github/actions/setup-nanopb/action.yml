name: Set up nanopb
description: Install nanopb and expose its protoc generator on PATH.

runs:
  using: composite
  steps:
    - name: Install nanopb
      shell: bash
      run: |
        brew install nanopb
        echo "$(brew --prefix nanopb)/bin" >> "$GITHUB_PATH"

    - name: Verify protobuf tools
      shell: bash
      run: |
        command -v protoc
        command -v protoc-gen-nanopb
